services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: csb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by infra/postgres/init/03_roles_and_grants.sh at first container init only.
      RESUME_INTEL_ROLE_PASSWORD: ${RESUME_INTEL_ROLE_PASSWORD}
      SECOND_BRAIN_ROLE_PASSWORD: ${SECOND_BRAIN_ROLE_PASSWORD}
      RECRUITMENT_ROLE_PASSWORD: ${RECRUITMENT_ROLE_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Queue broker for resume ingestion only (see docs/ARCHITECTURE_DECISIONS.md's amended constraint).
  # Deliberately NOT a source of truth and it never holds PII: jobs carry an opaque job
  # id, durable job state lives in Postgres (resume_intel.ingest_jobs), and the uploaded
  # file stays on a volume only Resume Intelligence and its worker mount. A flushed Redis
  # costs throughput, never a candidate record.
  redis:
    image: redis:7-alpine
    container_name: csb-redis
    restart: unless-stopped
    # appendonly keeps queued-but-unstarted jobs across a restart. Even without it the
    # system is correct -- ingest_jobs rows stay 'queued' and can be re-enqueued -- but
    # losing them silently would be a worse default.
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  resume-intelligence:
    build:
      context: ..
      dockerfile: services/resume-intelligence/Dockerfile
    container_name: csb-resume-intelligence
    restart: unless-stopped
    env_file:
      - ../services/resume-intelligence/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Raw uploads are PII. This volume is mounted ONLY here and on the worker, so the
      # "candidate PII lives only in Resume Intelligence" boundary is unchanged.
      - resume_uploads:/app/storage/uploads
    # Deliberately not published to the host. Only RWS calls this service, over the
    # compose network, and the browser never does -- publishing it only widened the
    # attack surface for a PII-owning service. Reach it for debugging with
    # `docker exec csb-resume-intelligence ...`, or re-add a mapping temporarily.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # Runs the ingestion pipeline off the request path. Same image and env as the API so
  # there is exactly one codebase and one config; only the command differs.
  resume-intelligence-worker:
    build:
      context: ..
      dockerfile: services/resume-intelligence/Dockerfile
    container_name: csb-resume-intelligence-worker
    restart: unless-stopped
    env_file:
      - ../services/resume-intelligence/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - resume_uploads:/app/storage/uploads
    # No migrations here: the API container owns `alembic upgrade head` (milestone 45).
    # Two containers racing the same migration on startup is a real failure mode.
    command: ["arq", "jobs.WorkerSettings"]
    healthcheck:
      # Checks the worker can still reach Redis, which is what "healthy" means for a
      # queue consumer. Not pgrep: procps is not in python:3.12-slim, so a pgrep-based
      # check reports unhealthy even while the worker is happily draining jobs.
      test: ["CMD-SHELL", "python -c \"import os,redis;redis.from_url(os.environ.get('REDIS_URL','redis://redis:6379')).ping()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  second-brain:
    build:
      context: ..
      dockerfile: services/second-brain/Dockerfile
    container_name: csb-second-brain
    restart: unless-stopped
    env_file:
      - ../services/second-brain/.env
    depends_on:
      postgres:
        condition: service_healthy
    # Not published to the host, same reasoning as resume-intelligence above: only
    # RWS talks to it, over the compose network.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  recruitment-workflow:
    build:
      context: ..
      dockerfile: services/recruitment-workflow/Dockerfile
    container_name: csb-recruitment-workflow
    restart: unless-stopped
    env_file:
      - ../services/recruitment-workflow/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RECRUITMENT_WORKFLOW_PORT:-8003}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  voicehr:
    build:
      context: ../services/voicehr
    container_name: csb-voicehr
    restart: unless-stopped
    env_file:
      - ../services/voicehr/.env
    volumes:
      - voicehr_data:/app/storage
    ports:
      - "${VOICEHR_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The local LLM fallback provider. It is a Compose service rather than a
  # hand-started host process because every way it failed was a way a host process
  # fails (milestone 65):
  #
  #   * it simply was not running, and nothing in the stack noticed;
  #   * when it was running, Ollama's default 127.0.0.1 binding is invisible from
  #     inside a container, so `host.docker.internal:11434` resolved and was then
  #     refused in ~10 ms;
  #   * the only symptom of either was a transient Gemini error turning into a hard
  #     job failure instead of a fallback.
  #
  # As a service it starts with the stack, is addressed as `ollama:11434` (no
  # host.docker.internal, no binding to get wrong), and has a healthcheck, so "the
  # fallback is down" is now a visible state rather than a silent one.
  #
  # Deliberately NOT a `depends_on` for the app services: a fallback provider that can
  # take the whole stack down when it fails to start is worse than the problem it
  # solves. The apps start regardless and use Gemini; reachability is reported at
  # runtime by each service's /health.
  ollama:
    # Pinned, and pinned to a version VERIFIED against the models this project actually
    # uses. 0.12.3 was chosen first and could NOT load gemma4:e2b-it-qat at all --
    # "unable to load model", with the GPU completely idle (582 MiB) and the blob
    # byte-identical on host and container, because the gemma4 architecture postdates
    # that release. Do not bump this without re-running
    # `python scripts/check_llm_fallback.py --generate`, which is what caught it: a
    # reachable Ollama serving a model it cannot load passes every other check there is.
    image: ollama/ollama:0.35.0
    container_name: csb-ollama
    restart: unless-stopped
    # The host's existing model store (~20 GB) is mounted rather than re-downloaded
    # into a named volume: pulls from Ollama's R2 blob host repeatedly failed on this
    # connection (milestone 61 -- two i/o timeouts and a DNS failure on one 7 GB
    # model), so re-fetching 6.4 GB of already-present weights is a real risk, not a
    # theoretical one. Read-write so `docker exec csb-ollama ollama pull` still works
    # and both the host CLI and the container share one store.
    volumes:
      - ${OLLAMA_MODELS_DIR}:/root/.ollama
    # Published so there is exactly ONE Ollama on this machine. The services reach it as
    # `ollama:11434`; the host-side benchmark scripts (benchmarks/local_llm/*) talk to
    # `localhost:11434` and now hit this same instance instead of a separately started
    # host process. Two instances would share one 6 GB GPU and one model store while
    # disagreeing about which was actually serving a request -- which is how the provider
    # attribution in milestone 63 got confusing in the first place.
    # NOTE: a host `ollama serve` must not be running, or this port bind fails.
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    # Verified working on this machine: `docker run --rm --gpus all nvidia/cuda ...`
    # reports the RTX 3060. Without the GPU the models fall back to CPU, which still
    # answers but slowly -- acceptable for a fallback, and it does not fail closed.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # `ollama list` exercises the same HTTP API the services use, so a pass here
      # means a pass for them. No curl in this image.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  voicehr_data:
  resume_uploads:
