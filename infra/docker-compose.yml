services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: csb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by infra/postgres/init/03_roles_and_grants.sh at first container init only.
      RESUME_INTEL_ROLE_PASSWORD: ${RESUME_INTEL_ROLE_PASSWORD}
      SECOND_BRAIN_ROLE_PASSWORD: ${SECOND_BRAIN_ROLE_PASSWORD}
      RECRUITMENT_ROLE_PASSWORD: ${RECRUITMENT_ROLE_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Queue broker for resume ingestion only (see CLAUDE.md's amended constraint).
  # Deliberately NOT a source of truth and it never holds PII: jobs carry an opaque job
  # id, durable job state lives in Postgres (resume_intel.ingest_jobs), and the uploaded
  # file stays on a volume only Resume Intelligence and its worker mount. A flushed Redis
  # costs throughput, never a candidate record.
  redis:
    image: redis:7-alpine
    container_name: csb-redis
    restart: unless-stopped
    # appendonly keeps queued-but-unstarted jobs across a restart. Even without it the
    # system is correct -- ingest_jobs rows stay 'queued' and can be re-enqueued -- but
    # losing them silently would be a worse default.
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  resume-intelligence:
    build:
      context: ..
      dockerfile: services/resume-intelligence/Dockerfile
    container_name: csb-resume-intelligence
    restart: unless-stopped
    env_file:
      - ../services/resume-intelligence/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Raw uploads are PII. This volume is mounted ONLY here and on the worker, so the
      # "candidate PII lives only in Resume Intelligence" boundary is unchanged.
      - resume_uploads:/app/storage/uploads
    # Deliberately not published to the host. Only RWS calls this service, over the
    # compose network, and the browser never does -- publishing it only widened the
    # attack surface for a PII-owning service. Reach it for debugging with
    # `docker exec csb-resume-intelligence ...`, or re-add a mapping temporarily.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # Runs the ingestion pipeline off the request path. Same image and env as the API so
  # there is exactly one codebase and one config; only the command differs.
  resume-intelligence-worker:
    build:
      context: ..
      dockerfile: services/resume-intelligence/Dockerfile
    container_name: csb-resume-intelligence-worker
    restart: unless-stopped
    env_file:
      - ../services/resume-intelligence/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - resume_uploads:/app/storage/uploads
    # No migrations here: the API container owns `alembic upgrade head` (milestone 45).
    # Two containers racing the same migration on startup is a real failure mode.
    command: ["arq", "jobs.WorkerSettings"]
    healthcheck:
      # Checks the worker can still reach Redis, which is what "healthy" means for a
      # queue consumer. Not pgrep: procps is not in python:3.12-slim, so a pgrep-based
      # check reports unhealthy even while the worker is happily draining jobs.
      test: ["CMD-SHELL", "python -c \"import os,redis;redis.from_url(os.environ.get('REDIS_URL','redis://redis:6379')).ping()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  second-brain:
    build:
      context: ..
      dockerfile: services/second-brain/Dockerfile
    container_name: csb-second-brain
    restart: unless-stopped
    env_file:
      - ../services/second-brain/.env
    depends_on:
      postgres:
        condition: service_healthy
    # Not published to the host, same reasoning as resume-intelligence above: only
    # RWS talks to it, over the compose network.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  recruitment-workflow:
    build:
      context: ..
      dockerfile: services/recruitment-workflow/Dockerfile
    container_name: csb-recruitment-workflow
    restart: unless-stopped
    env_file:
      - ../services/recruitment-workflow/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RECRUITMENT_WORKFLOW_PORT:-8003}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  voicehr:
    build:
      context: ../services/voicehr
    container_name: csb-voicehr
    restart: unless-stopped
    env_file:
      - ../services/voicehr/.env
    volumes:
      - voicehr_data:/app/storage
    ports:
      - "${VOICEHR_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  voicehr_data:
  resume_uploads:
