<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceHR Report</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        h1 { margin-bottom: 0.5rem; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.85rem; font-weight: 600; color: #fff; }
        .badge-en { background: #2563eb; }
        .badge-fr { background: #7c3aed; }
        .score-big { font-size: 3rem; font-weight: 700; }
        .cefr-badge { font-size: 1.5rem; padding: 0.4rem 1rem; border-radius: 8px; }
        .cefr-a2 { background: #ef4444; }
        .cefr-b1 { background: #f59e0b; }
        .cefr-b2 { background: #22c55e; }
        .cefr-c1 { background: #2563eb; }
        .confidence-low { background: #ef4444; }
        .confidence-medium { background: #f59e0b; }
        .confidence-high { background: #22c55e; }
        .inconclusive-banner { background: #fef3c7; border: 1px solid #f59e0b; padding: 1rem; border-radius: 8px; text-align: center; font-weight: 600; color: #92400e; }
        .dimension { display: flex; align-items: center; margin-bottom: 0.8rem; gap: 0.5rem; }
        .dimension .label { width: 160px; font-weight: 500; }
        .bar-track { flex: 1; height: 16px; background: #e5e5e5; border-radius: 8px; overflow: hidden; }
        .bar { height: 100%; border-radius: 8px; transition: width 0.5s; }
        .dimension .value { width: 30px; text-align: right; font-weight: 600; }
        .strengths li { margin-bottom: 0.5rem; padding: 0.5rem; background: #f0fdf4; border-radius: 4px; }
        .concerns li { margin-bottom: 0.5rem; padding: 0.5rem; background: #fffbeb; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #e5e5e5; font-size: 0.9rem; }
        .stats-row { display: flex; gap: 2rem; justify-content: center; }
        .stat { text-align: center; }
        .stat .stat-value { font-size: 1.5rem; font-weight: 700; }
        .stat .stat-label { color: #666; font-size: 0.85rem; }
        audio { width: 100%; margin-top: 0.5rem; }
        .transcript { max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 0.9rem; line-height: 1.6; padding: 1rem; background: #f9f9f9; border-radius: 6px; }
        .transcript .ts { color: #666; }
        .transcript .speaker-sarah { color: #2563eb; font-weight: 600; }
        .transcript .speaker-candidate { color: #7c3aed; font-weight: 600; }
        .loading { text-align: center; padding: 3rem; color: #666; }
        h3 { margin-bottom: 0.8rem; }
    </style>
    <link rel="stylesheet" href="/theme.css">
</head>
<body class="linen-page">
    <div class="report-wrap" id="app">
        <div class="loading" id="loading">Loading report...</div>
    </div>

    <script>
        const reportToken = new URLSearchParams(window.location.search).get('token');

        async function loadReport() {
            if (!reportToken) {
                document.getElementById('loading').textContent = 'Report not found.';
                return;
            }
            try {
                const res = await fetch(`/api/report/${reportToken}`);
                if (!res.ok) {
                    document.getElementById('loading').textContent = 'Report not found.';
                    return;
                }
                const report = await res.json();
                renderReport(report);
            } catch (e) {
                document.getElementById('loading').textContent = 'Failed to load report.';
            }
        }

        function barColor(score) {
            if (score == null) return '#ccc';
            if (score < 50) return '#ef4444';
            if (score < 65) return '#f59e0b';
            return '#22c55e';
        }

        function renderReport(r) {
            const langClass = r.language === 'en' ? 'badge-en' : 'badge-fr';
            const langLabel = r.language === 'en' ? 'English' : 'French';
            const date = new Date(r.interview_date).toLocaleString();

            let html = '';

            html += `<div class="report-card report-header">
                <h1 class="heading">${r.candidate_name}</h1>
                <span class="badge ${langClass}">${langLabel}</span>
                <span style="color:#666;margin-left:0.5rem;">${date}</span>
            </div>`;

            if (r.status === 'terminated') {
                const reason = r.termination_reason === 'abusive_language'
                    ? 'The interview ended because the conversation was not respectful.'
                    : 'The interview ended because the assessment questions were not answered.';
                html += `<div class="report-card"><div class="inconclusive-banner"><span class="inconclusive-label">Interview terminated</span><p class="inconclusive-body">${reason}</p></div></div>`;
            }

            html += `<div class="report-card"><p class="meta">${r.assessment_type || 'B2-style estimate; not an official language certification.'}</p></div>`;

            if (r.evaluation_status === 'failed') {
                html += `<div class="report-card"><div class="inconclusive-banner">
                    <span class="inconclusive-label">Evaluation failed</span>
                    <p class="inconclusive-body">The transcript and recording are available, but Gemini could not produce scores.</p>
                    <p class="inconclusive-body">${r.evaluation_error || 'No provider error was recorded.'}</p>
                    <button onclick="retryEvaluation()">Retry evaluation</button>
                </div></div>`;
            }

            if (r.inconclusive) {
                html += `<div class="report-card"><div class="inconclusive-banner"><span class="inconclusive-label">Inconclusive</span><p class="inconclusive-body">The interview was too short for a reliable assessment. Confidence: ${r.confidence || 'Low'}. Raw transcript is available below.</p></div></div>`;
            } else {
                html += `<div class="report-card">
                    <div class="score-row"><span class="score-num">${r.overall_score ?? 'N/A'}</span><span class="score-cefr">${r.cefr_level || 'N/A'}</span><span class="score-conf">${r.confidence || 'N/A'} confidence</span></div>
                </div>`;
            }

            if (r.dimensions) {
                html += `<div class="report-card"><h3>Dimension Scores</h3>`;
                const dims = [
                    ['Interaction & Comprehension', r.dimensions.interaction_comprehension ?? r.dimensions.comprehension],
                    ['Fluency & Coherence', r.dimensions.fluency_coherence ?? r.dimensions.fluency],
                    ['Grammar & Language Control', r.dimensions.grammar_language_control ?? r.dimensions.grammar],
                    ['Vocabulary & Range', r.dimensions.vocabulary_range ?? r.dimensions.vocabulary],
                    ['Pronunciation & Intelligibility', r.dimensions.pronunciation_intelligibility ?? r.dimensions.pronunciation]
                ];
                for (const [label, score] of dims) {
                    html += `<div class="dim-row">
                        <span class="dim-label">${label}</span>
                        <div class="dim-track"><div class="dim-fill" style="width:${score || 0}%;background:${barColor(score)}"></div></div>
                        <span class="dim-val">${score ?? '—'}</span>
                    </div>`;
                }
                html += `</div>`;
            }

            if (r.strengths && r.strengths.length) {
                html += `<div class="report-card"><h3>Strengths</h3>`;
                for (const s of r.strengths) {
                    html += `<div class="strength-card"><div class="strength-header"><span class="strength-label">Strength</span><span class="strength-time">${s.timestamp || ''}</span></div><p class="strength-quote">${s.text}</p></div>`;
                }
                html += `</div>`;
            }

            if (r.concerns && r.concerns.length) {
                html += `<div class="report-card"><h3>Concerns</h3>`;
                for (const c of r.concerns) {
                    html += `<div class="concern-card"><div class="concern-header"><span class="concern-label">Concern</span><span class="concern-time">${c.timestamp || ''}</span></div><p class="concern-quote">${c.text}</p></div>`;
                }
                html += `</div>`;
            }

            if (r.evidence && r.evidence.length) {
                html += `<div class="report-card"><h3>Evidence</h3><table class="report-table">
                    <tr><th>Timestamp</th><th>Quote</th><th>Dimension</th><th>Note</th></tr>`;
                for (const e of r.evidence) {
                    html += `<tr><td>${e.timestamp || ''}</td><td>"${e.quote || ''}"</td><td>${e.dimension || ''}</td><td>${e.note || ''}</td></tr>`;
                }
                html += `</table></div>`;
            }

            if (r.stats) {
                const formatDuration = seconds => {
                    if (seconds == null) return 'N/A';
                    const mins = Math.floor(seconds / 60);
                    const secs = Math.round(seconds % 60);
                    return `${mins}m ${String(secs).padStart(2, '0')}s`;
                };
                html += `<div class="report-card"><div class="stats-row">
                    <div class="stat"><div class="stat-value">${formatDuration(r.stats.interview_duration_seconds ?? r.stats.duration_seconds)}</div><div class="stat-label">Interview Duration</div></div>
                    <div class="stat"><div class="stat-value">${formatDuration(r.stats.candidate_speaking_duration_seconds ?? r.stats.candidate_speaking_time)}</div><div class="stat-label">Candidate Speaking</div></div>
                    <div class="stat"><div class="stat-value">${r.stats.word_count || 'N/A'}</div><div class="stat-label">Words</div></div>
                </div></div>`;
            }

            if (r.recording && r.recording.url) {
                html += `<div class="report-card"><h3>Recording</h3><audio controls src="${r.recording.url}"></audio></div>`;
            }

            if (r.transcript && r.transcript.length) {
                html += `<div class="report-card"><h3>Transcript</h3><div class="transcript-list">`;
                for (const turn of r.transcript) {
                    const timestampValue = String(turn.timestamp || '0');
                    const parsedSeconds = timestampValue.includes(':')
                        ? timestampValue.split(':').reduce((total, part) => total * 60 + Number(part), 0)
                        : Number(timestampValue);
                    const seconds = Number.isFinite(parsedSeconds) ? parsedSeconds : 0;
                    const timestamp = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
                    const candidate = turn.role === 'user' || turn.role === 'candidate';
                    html += `<div class="transcript-turn"><span class="turn-ts">${timestamp}</span><span class="turn-who">${candidate ? 'Candidate' : 'Sarah'}</span><span class="turn-text">${turn.text || ''}</span></div>`;
                }
                html += `</div></div>`;
            }

            document.getElementById('app').innerHTML = html;
        }

        async function retryEvaluation() {
            try {
                const res = await fetch(`/api/admin/reports/${reportToken}/retry`, { method: 'POST' });
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    throw new Error(body.detail || 'Retry failed.');
                }
                renderReport(await res.json());
            } catch (error) {
                alert(error.message);
            }
        }

        loadReport();
    </script>
</body>
</html>
