   <g id="text_1">
    <text style="fill: #3a3f4a; font: 5.7px 'Arial', 'DejaVu Sans'" transform="translate(21.635508 17.568481)">The synchronous request and the queued worker run the same function. A queued job is committed in</text>
    <text style="fill: #3a3f4a; font: 5.7px 'Arial', 'DejaVu Sans'" transform="translate(63.727781 24.374682)">PostgreSQL first, and only then is its opaque identifier sent to Redis.</text>
   </g>
