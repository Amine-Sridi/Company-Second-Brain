   <g id="text_2">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="17.875564" y="56.670033" transform="rotate(-0 17.875564 56.670033)">1</text>
   </g>
   <g id="text_3">
    <text style="fill: #10244f; font: 700 6.7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="28.412988" y="56.695955" transform="rotate(-0 28.412988 56.695955)">Text extraction</text>
   </g>
   <g id="text_4">
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(14.227994 72.878336)">Selectable text and DOCX</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(14.227994 79.168033)">tables are read directly.</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(14.227994 85.522183)">Scanned PDF, JPG and PNG</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(14.227994 91.904899)">go through OCR, in French</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(14.227994 98.259049)">and English.</text>
   </g>
   <g id="text_5">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="119.196943" y="56.670033" transform="rotate(-0 119.196943 56.670033)">2</text>
   </g>
   <g id="text_6">
    <text style="fill: #4a2a06; font: 700 6.7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="129.734367" y="56.692814" transform="rotate(-0 129.734367 56.692814)">Structuring</text>
   </g>
   <g id="text_7">
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(115.549374 72.945367)">The language model fills a</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(115.549374 79.387999)">predefined schema: experience,</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(115.549374 85.677696)">skills, education, projects,</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(115.549374 92.031846)">languages.</text>
   </g>
   <g id="text_8">
    <text style="fill: #6b1f1f; font: 5.1px 'Arial', 'DejaVu Sans'" transform="translate(121.870313 102.539761)">bounded attempts failed:</text>
    <text style="fill: #6b1f1f; font: 5.1px 'Arial', 'DejaVu Sans'" transform="translate(123.430195 107.751443)">no candidate is created</text>
   </g>
   <g id="text_9">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="220.518323" y="56.670033" transform="rotate(-0 220.518323 56.670033)">3</text>
   </g>
   <g id="text_10">
    <text style="fill: #10244f; font: 700 6.7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="231.055746" y="56.651986" transform="rotate(-0 231.055746 56.651986)">Post-processing</text>
   </g>
   <g id="text_11">
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(216.870753 72.878336)">Skills are cleaned and</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(216.870753 79.168033)">deduplicated. Experience is</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(216.870753 85.546211)">recomputed from the stored</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(216.870753 91.924389)">periods, not copied from the</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(216.870753 98.214086)">model output.</text>
   </g>
   <g id="text_12">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="220.518323" y="145.832847" transform="rotate(-0 220.518323 145.832847)">4</text>
   </g>
   <g id="text_13">
    <text style="fill: #10244f; font: 700 6.7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="231.055746" y="145.855628" transform="rotate(-0 231.055746 145.855628)">Storage</text>
   </g>
   <g id="text_14">
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(216.870753 162.04115)">A normalized email detects</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(216.870753 168.330847)">duplicates. The existing</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(216.870753 174.684997)">candidate is updated, and no</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(216.870753 181.063175)">second profile is created.</text>
   </g>
   <g id="text_15">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="119.196943" y="145.832847" transform="rotate(-0 119.196943 145.832847)">5</text>
   </g>
   <g id="text_16">
    <text style="fill: #10244f; font: 700 6.7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="129.734367" y="145.855628" transform="rotate(-0 129.734367 145.855628)">Safe summary</text>
   </g>
   <g id="text_17">
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(115.549374 162.04115)">Built from an allow-list:</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(115.549374 168.330847)">positions, companies,</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(115.549374 174.620544)">technologies, education,</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(115.549374 180.974694)">skills, certifications and</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(115.549374 187.264391)">spoken languages.</text>
   </g>
   <g id="text_18">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="17.875564" y="145.832847" transform="rotate(-0 17.875564 145.832847)">6</text>
   </g>
   <g id="text_19">
    <text style="fill: #3f3000; font: 700 6.7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="28.412988" y="145.858768" transform="rotate(-0 28.412988 145.858768)">Hand-off</text>
   </g>
   <g id="text_20">
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(14.227994 162.108181)">Checked against a restricted</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(14.227994 168.462331)">schema, then sent to the</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(14.227994 174.840509)">Second Brain with the opaque</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(14.227994 181.130206)">candidate id. A retry replaces</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(14.227994 187.484356)">the existing record.</text>
   </g>
  </g>
 </g>
 <defs>
