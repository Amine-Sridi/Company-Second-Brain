   <g id="text_5">
    <text style="fill: #10244f; font: 700 5.9px 'Arial', 'DejaVu Sans'; text-anchor: start" x="41.382124" y="43.924729" transform="rotate(-0 41.382124 43.924729)">Unit</text>
   </g>
   <g id="text_6">
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(89.003172 40.60367)">Pure rules: scoring, language gate,</text>
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(89.003172 46.966225)">sufficiency, authentication</text>
   </g>
   <g id="text_7">
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(187.28491 40.711693)">No service and</text>
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(187.28491 46.922654)">no database</text>
   </g>
   <g id="text_8">
    <text style="fill: #8a3a3a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(243.011669 40.711693)">Real database</text>
    <text style="fill: #8a3a3a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(243.011669 46.922654)">constraints</text>
   </g>
   <g id="text_9">
    <text style="fill: #ffffff; font: 700 6.2px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="31.249986" y="84.733689" transform="rotate(-0 31.249986 84.733689)">2</text>
   </g>
   <g id="text_10">
    <text style="fill: #10244f; font: 700 5.9px 'Arial', 'DejaVu Sans'; text-anchor: start" x="41.382124" y="84.414562" transform="rotate(-0 41.382124 84.414562)">Integration</text>
   </g>
   <g id="text_11">
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(89.003172 81.199683)">Real applications and PostgreSQL:</text>
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(89.003172 87.562237)">constraints and component flows</text>
   </g>
   <g id="text_12">
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(187.28491 81.240245)">A disposable</text>
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(187.28491 87.451206)">test database</text>
   </g>
   <g id="text_13">
    <text style="fill: #8a3a3a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(243.011669 81.208019)">Browser behavior,</text>
    <text style="fill: #8a3a3a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(243.011669 87.418979)">built images</text>
   </g>
   <g id="text_14">
    <text style="fill: #ffffff; font: 700 6.2px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="31.249986" y="125.26224" transform="rotate(-0 31.249986 125.26224)">3</text>
   </g>
   <g id="text_15">
    <text style="fill: #10244f; font: 700 5.9px 'Arial', 'DejaVu Sans'" transform="translate(41.382124 121.97138)">Frontend</text>
    <text style="fill: #10244f; font: 700 5.9px 'Arial', 'DejaVu Sans'" transform="translate(41.382124 127.992284)">and browser</text>
   </g>
   <g id="text_16">
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(89.003172 121.73657)">Labels, score bands, components,</text>
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(89.003172 127.947531)">then navigation and recruiter actions</text>
   </g>
   <g id="text_17">
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(187.28491 121.802312)">Component runner,</text>
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(187.28491 128.013273)">then the frontend</text>
   </g>
   <g id="text_18">
    <text style="fill: #8a3a3a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(243.011669 121.768797)">What happens</text>
    <text style="fill: #8a3a3a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(243.011669 127.979758)">inside a container</text>
   </g>
   <g id="text_19">
    <text style="fill: #ffffff; font: 700 6.2px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="31.249986" y="165.790792" transform="rotate(-0 31.249986 165.790792)">4</text>
   </g>
   <g id="text_20">
    <text style="fill: #1e4620; font: 700 5.9px 'Arial', 'DejaVu Sans'; text-anchor: start" x="41.382124" y="165.510384" transform="rotate(-0 41.382124 165.510384)">Container</text>
   </g>
   <g id="text_21">
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(89.003172 162.298638)">Configuration, provider address,</text>
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(89.003172 168.574052)">models, optional real completion</text>
   </g>
   <g id="text_22">
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(187.28491 162.265122)">Running containers</text>
    <text style="fill: #2b303a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(187.28491 168.540536)">for each service</text>
   </g>
   <g id="text_23">
    <text style="fill: #8a3a3a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(243.011669 162.297349)">Business rules</text>
    <text style="fill: #8a3a3a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(243.011669 168.50831)">in detail</text>
   </g>
   <g id="text_24">
    <text style="fill: #2f4f7f; font: 5.2px 'Arial', 'DejaVu Sans'" transform="translate(8.651953 137.581291) rotate(-90)">closer to the deployed system</text>
