   <g id="text_5">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="21.928419" y="40.458612" transform="rotate(-0 21.928419 40.458612)">1</text>
   </g>
   <g id="text_6">
    <text style="fill: #10244f; font: 700 7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="32.060557" y="40.5623" transform="rotate(-0 32.060557 40.5623)">Upload</text>
   </g>
   <g id="text_7">
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(18.28085 56.26163)">A recruiter uploads</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(18.28085 62.551327)">a candidate resume.</text>
   </g>
   <g id="text_8">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="94.069241" y="40.458612" transform="rotate(-0 94.069241 40.458612)">2</text>
   </g>
   <g id="text_9">
    <text style="fill: #10244f; font: 700 7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="104.201379" y="40.5623" transform="rotate(-0 104.201379 40.5623)">Store</text>
   </g>
   <g id="text_10">
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(90.421672 56.26163)">Resume Intelligence</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(90.421672 62.61578)">stores the file and</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(90.421672 68.905477)">records an ingestion</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(90.421672 75.259627)">job.</text>
   </g>
   <g id="text_11">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="166.210063" y="40.458612" transform="rotate(-0 166.210063 40.458612)">3</text>
   </g>
   <g id="text_12">
    <text style="fill: #10244f; font: 700 7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="176.342201" y="40.5623" transform="rotate(-0 176.342201 40.5623)">Answer</text>
   </g>
   <g id="text_13">
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(162.562494 56.328661)">The job identifier</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(162.562494 62.682811)">is returned at once.</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(162.562494 68.972508)">The recruiter can</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(162.562494 75.262205)">move on.</text>
   </g>
   <g id="text_14">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="94.069241" y="131.647853" transform="rotate(-0 94.069241 131.647853)">4</text>
   </g>
   <g id="text_15">
    <text style="fill: #1f2937; font: 700 7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="104.201379" y="131.751541" transform="rotate(-0 104.201379 131.751541)">Queue</text>
   </g>
   <g id="text_16">
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(90.421672 147.450871)">It carries only an</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(90.421672 153.805021)">opaque job id, never</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(90.421672 160.159171)">the file itself.</text>
   </g>
   <g id="text_17">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="166.210063" y="131.647853" transform="rotate(-0 166.210063 131.647853)">5</text>
   </g>
   <g id="text_18">
    <text style="fill: #1f2937; font: 700 7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="176.342201" y="131.751541" transform="rotate(-0 176.342201 131.751541)">Worker</text>
   </g>
   <g id="text_19">
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(162.562494 147.450871)">Extracts and</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(162.562494 153.740568)">structures the</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(162.562494 160.030265)">resume, then</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(162.562494 166.319962)">creates the</text>
    <text style="fill: #3a3f4a; font: 5.5px 'Arial', 'DejaVu Sans'" transform="translate(162.562494 172.609659)">candidate.</text>
   </g>
   <g id="text_20">
    <text style="fill: #ffffff; font: 700 6.6px 'Arial', 'DejaVu Sans'; text-anchor: middle" x="238.350886" y="131.647853" transform="rotate(-0 238.350886 131.647853)">6</text>
   </g>
   <g id="text_21">
    <text style="fill: #3f3000; font: 700 7px 'Arial', 'DejaVu Sans'; text-anchor: start" x="248.483023" y="131.751541" transform="rotate(-0 248.483023 131.751541)">Records</text>
   </g>
   <g id="text_22">
    <text style="fill: #2f4f7f; font: 5.6px 'Arial', 'DejaVu Sans'; text-anchor: start" x="117.981087" y="103.792469" transform="rotate(-0 117.981087 103.792469)">job id</text>
   </g>
   <g id="text_23">
    <text style="fill: #3f3000; font: 700 5.1px 'Arial', 'DejaVu Sans'; text-anchor: start" x="235.919172" y="148.078374" transform="rotate(-0 235.919172 148.078374)">Candidate record</text>
